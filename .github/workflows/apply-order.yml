name: apply-order
on:
  push:
    paths:
      - '.github/workflows/apply-order.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          python3 - <<'EOF'
          import json, io, hashlib
          pairs = json.load(io.open('_patch/wk_order.json', encoding='utf-8'))
          t = io.open('index.html', encoding='utf-8').read()
          for old, new in pairs:
              n = t.count(old)
              assert n == 1, "블록이 %d 번 나옴: %r" % (n, old[:70])
              t = t.replace(old, new, 1)
          io.open('index.html', 'w', encoding='utf-8').write(t)
          b = io.open('index.html', 'rb').read()
          got = hashlib.sha1(b"blob %d\0" % len(b) + b).hexdigest()
          exp = '992201f0393328e62c3374b10c4f26de43a75e77'
          print('index.html', got, 'OK' if got == exp else 'MISMATCH expected ' + exp)
          if got != exp:
              raise SystemExit("sha1 불일치 — 커밋하지 않음")
          EOF
      - name: commit
        run: |
          rm -rf _patch .github/workflows/apply-order.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 쓰기 칸 획순 선을 기본으로 끄기 (선택은 기억)"
          git push
