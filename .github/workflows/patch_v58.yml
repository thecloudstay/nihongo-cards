name: patch-v58
on: workflow_dispatch

# v5.8 — G2/G1 문형 팩을 cards_all/cards_free 에 병합하고 NAV 에 등록한다.
#   ⚠ 순서 중요: 병합 → NAV 패치 → 한 번에 커밋 (팩이 없는데 NAV 만 올라가면 빈 팩이 보인다)
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: merge packs
        run: |
          python3 - <<'PYEOF'
          import io,json,glob
          PREVIEW=10
          A=json.load(io.open('cards_all.json',encoding='utf-8'))
          F=json.load(io.open('cards_free.json',encoding='utf-8'))
          have={r.get('category') for r in A}
          keys=list(A[0].keys()); added=[]
          for f in sorted(glob.glob('packs/*.json')):
              rows=json.load(io.open(f,encoding='utf-8'))
              cat=rows[0]['category']
              if cat in have: continue
              norm=[{k:r.get(k,'') for k in keys} for r in rows]
              A+=norm
              tier=rows[0].get('tier','paid')
              F+= norm if tier=='free' else norm[:PREVIEW]
              added.append(f'{cat}({len(rows)})'); have.add(cat)
          if added:
              json.dump(A,io.open('cards_all.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
              json.dump(F,io.open('cards_free.json','w',encoding='utf-8'),ensure_ascii=False,separators=(',',':'))
          print('merged:', ', '.join(added) or '없음')
          print('cards_all', len(A), '장 /', len({r.get('category') for r in A}), '카테고리')
          PYEOF
      - name: apply NAV patch
        run: |
          python3 - <<'PYEOF'
          import io,json,sys
          P=json.load(io.open('_patch_v58.json',encoding='utf-8'))
          s=io.open('index.html',encoding='utf-8').read()
          for i,(a,b) in enumerate(P):
              if s.count(a)!=1:
                  sys.exit('FAIL patch #%d (found %d)' % (i,s.count(a)))
              s=s.replace(a,b,1)
          io.open('index.html','w',encoding='utf-8').write(s)
          print('NAV patched ->',len(s),'chars')
          PYEOF
      - name: cleanup + commit
        run: |
          rm -f _patch_v58.json .github/workflows/patch_v58.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(cards): JLPT 급별 문형 완성 — N2 문형 90 · N1 문형 90 추가 (G5~G1 전 급수)"
          git push
