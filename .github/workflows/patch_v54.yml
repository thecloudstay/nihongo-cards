name: patch-v54
on: workflow_dispatch

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: apply v5.4 continuous-reading patch
        run: |
          python3 - <<'PYEOF'
          import io,json,sys
          P=json.load(io.open('_patch_v54.json',encoding='utf-8'))
          s=io.open('index.html',encoding='utf-8').read()
          for i,(a,b) in enumerate(P):
              if s.count(a)!=1:
                  sys.exit('FAIL patch #%d (found %d) :: %s' % (i,s.count(a),a[:70]))
              s=s.replace(a,b,1)
          io.open('index.html','w',encoding='utf-8').write(s)
          print('applied',len(P),'patches ->',len(s),'chars')
          PYEOF
      - name: cleanup + commit
        run: |
          rm -f _patch_v54.json .github/workflows/patch_v54.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(read): 연속 읽기 — 장별(🔂)/연속(🔁) 전환, 책 끝까지 이어 읽고 언제든 멈춤"
          git push
