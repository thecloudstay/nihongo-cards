name: assemble-index
on: workflow_dispatch

# _deploy_parts/part00~16.txt 를 index.html 로 다시 합친다.
#  ⚠ 원본 blob sha1 과 일치할 때만 커밋한다 — 한 조각이라도 깨지면 앱 전체가 죽는다.
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # ← 이게 없어서 git push 가 exit 128 로 죽었다
    steps:
      - uses: actions/checkout@v4

      - name: 조각 합치기 + 무결성 검증
        run: |
          set -e
          EXPECTED="bb87539ea5c7e420b44b71b81a1d1df3596b8bea"
          rm -f /tmp/new.html
          for i in $(seq -w 0 16); do
            f="_deploy_parts/part${i}.txt"
            [ -f "$f" ] || { echo "MISSING $f"; exit 1; }
            cat "$f" >> /tmp/new.html
          done
          ACTUAL=$(python3 - <<'PY'
          import hashlib
          d=open('/tmp/new.html','rb').read()
          h=hashlib.sha1(); h.update(b'blob %d\0'%len(d)); h.update(d)
          print(h.hexdigest())
          PY
          )
          echo "size=$(wc -c < /tmp/new.html)  expected=$EXPECTED  actual=$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "❌ 해시 불일치 — 배포 중단"; exit 1; }
          echo "✅ 해시 일치"
          cp /tmp/new.html index.html

      - name: 정리 + 커밋
        run: |
          set -e
          rm -rf _deploy_parts
          rm -f .github/workflows/assemble-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(brand): YOMI 리브랜딩 — 책 중심 홈(오늘 읽을 책·서재·내 기록) · 부가기능 하향 · 메타/PWA 브랜드 교체"
          git push
