name: apply-v64-patch
on:
  push:
    paths:
      - '.github/workflows/apply-v64-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches and verify
        run: |
          python3 - <<'PY'
          import json, hashlib, os, subprocess
          patch = json.load(open('_patches/v6.4_bugfix.json', 'r', encoding='utf-8'))
          html = open('index.html', 'r', encoding='utf-8').read()
          for i, (old, new) in enumerate(patch['patches']):
              idx = html.find(old)
              if idx < 0:
                  raise SystemExit(f'patch #{i} not found in index.html')
              html = html[:idx] + new + html[idx+len(old):]
          data = html.encode('utf-8')
          h = hashlib.sha1(); h.update(f'blob {len(data)}\0'.encode()); h.update(data)
          got = h.hexdigest()
          if got != patch['target_sha']:
              raise SystemExit(f'sha mismatch: got {got} want {patch["target_sha"]}')
          open('index.html', 'w', encoding='utf-8').write(html)
          os.remove('_patches/v6.4_bugfix.json')
          try: os.rmdir('_patches')
          except: pass
          os.remove('.github/workflows/apply-v64-patch.yml')
          print('OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v6.4: kanji tap + continuous-read skip fix (auto-applied)"
          git push
