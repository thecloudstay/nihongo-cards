name: apply-order2
on:
  push:
    paths:
      - '.github/workflows/apply-order2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          python3 - <<'EOF'
          import json, io, hashlib
          pairs = json.load(io.open('_patch/order.json', encoding='utf-8'))
          t = io.open('index.html', encoding='utf-8').read()
          for old, new in pairs:
              n = t.count(old)
              assert n == 1, "블록이 %d 번 나옴: %r" % (n, old[:70])
              t = t.replace(old, new, 1)
          io.open('index.html', 'w', encoding='utf-8').write(t)
          b = io.open('index.html', 'rb').read()
          got = hashlib.sha1(b"blob %d\0" % len(b) + b).hexdigest()
          exp = 'df5f2121e2bb883c667ab6c5e9db141a393f2603'
          print('index.html', got, 'OK' if got == exp else 'MISMATCH expected ' + exp)
          if got != exp:
              raise SystemExit("sha1 불일치 — 커밋하지 않음")
          EOF
      - name: commit
        run: |
          rm -rf _patch .github/workflows/apply-order2.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 단어 창을 열면 쓰는 칸부터 — 한자·읽기·뜻은 그 아래로"
          git push
