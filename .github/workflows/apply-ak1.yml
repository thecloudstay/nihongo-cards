name: apply-ak1
on:
  push:
    paths:
      - '.github/workflows/apply-ak1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          python3 - <<'EOF'
          import json, io, hashlib

          new = json.load(io.open('_patch/ak1_chapters.json', encoding='utf-8'))
          assert new['id'] == 'andokuma1', new['id']
          assert len(new['chapters']) == 6, len(new['chapters'])

          B = json.load(io.open('books.json', encoding='utf-8'))
          b = [x for x in B if x['id'] == 'andokuma1'][0]
          assert len(b['chapters']) == 9, "이미 교체됐거나 장 수가 다름: %d" % len(b['chapters'])
          b['chapters'] = new['chapters']

          io.open('books.json', 'w', encoding='utf-8').write(
              json.dumps(B, ensure_ascii=False, separators=(',', ':')))

          raw = io.open('books.json', 'rb').read()
          got = hashlib.sha1(b"blob %d\0" % len(raw) + raw).hexdigest()
          exp = 'f5c92c645160f9185398136369ea7feba9c9d973'
          print('편 %d · 장 %d · 문장 %d' % (
              len(B), sum(len(x['chapters']) for x in B),
              sum(len(c['s']) for x in B for c in x['chapters'])))
          print('books.json', got, 'OK' if got == exp else 'MISMATCH expected ' + exp)
          if got != exp:
              raise SystemExit("sha1 불일치 — 커밋하지 않음")
          EOF
      - name: commit
        run: |
          rm -rf _patch .github/workflows/apply-ak1.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 안도VS구마 1부 재번역 — 원문·번역 짝 정렬 복구"
          git push
