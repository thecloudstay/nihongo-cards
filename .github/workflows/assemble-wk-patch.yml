name: assemble-wk-patch

on:
  push:
    paths:
      - '.github/workflows/assemble-wk-patch.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify
        run: |
          python3 - <<'PY'
          import glob, base64, bz2, hashlib, os
          EXP_SIZE = 14663
          EXP_BLOB = 'a6b5dee9fc267a6a9e0757d28ad4fa3c953fb2f0'
          parts = sorted(glob.glob('_b64wk/part*.txt'))
          assert parts, 'no parts found'
          s = ''.join(open(p, encoding='ascii').read() for p in parts)
          s = ''.join(s.split())
          raw = bz2.decompress(base64.b64decode(s))
          assert len(raw) == EXP_SIZE, 'size %d != %d' % (len(raw), EXP_SIZE)
          blob = hashlib.sha1(b'blob %d\0' % len(raw) + raw).hexdigest()
          assert blob == EXP_BLOB, 'blob %s != %s' % (blob, EXP_BLOB)
          os.makedirs('_patch', exist_ok=True)
          with open('_patch/wk_patch.json', 'wb') as f:
              f.write(raw)
          print('OK size=%d blob=%s parts=%d' % (len(raw), blob, len(parts)))
          PY

      - name: Commit result and self-clean
        run: |
          rm -rf _b64wk
          rm -f .github/workflows/assemble-wk-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'patch: 단어 창 안에서 바로 쓰기'
          git push
